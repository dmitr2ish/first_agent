name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: resources/requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r resources/requirements.lock

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile active modules
        run: >-
          python -m compileall -q
          benchmark_runner.py
          visa_cli.py
          visa_research
          tests

      - name: Verify imports without Ollama
        run: >-
          python -c
          "import visa_research.cli, visa_research.workflow,
          visa_research.sources.collector, visa_research.sources.tools,
          visa_research.reporting, visa_research.benchmark.runner"

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
